<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal - React + Bootstrap</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f5f7fb;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .hero {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 70px 20px;
        }

        .job-card {
            transition: 0.2s;
        }

        .job-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .dashboard-card {
            border: none;
            border-radius: 12px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
        }
    </style>
</head>

<body>

<div id="root"></div>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- Babel -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">

const { useState } = React;


/* =========================
   JOB DATA
========================= */

const jobs = [
    {
        id: 1,
        title: "Junior Data Analyst",
        company: "ABC Technologies",
        location: "Bangalore",
        type: "Full Time",
        salary: "₹4 - ₹6 LPA",
        skills: "SQL, Excel, Power BI"
    },
    {
        id: 2,
        title: "React Developer",
        company: "Tech Solutions",
        location: "Delhi",
        type: "Full Time",
        salary: "₹5 - ₹8 LPA",
        skills: "React, JavaScript, Bootstrap"
    },
    {
        id: 3,
        title: "Business Analyst Intern",
        company: "Global Corp",
        location: "Mumbai",
        type: "Internship",
        salary: "₹15,000 / month",
        skills: "Excel, SQL, Communication"
    },
    {
        id: 4,
        title: "Python Developer",
        company: "SoftTech",
        location: "Pune",
        type: "Full Time",
        salary: "₹5 - ₹9 LPA",
        skills: "Python, Django, SQL"
    },
    {
        id: 5,
        title: "UI/UX Designer",
        company: "Creative Studio",
        location: "Hyderabad",
        type: "Part Time",
        salary: "₹25,000 / month",
        skills: "Figma, UI Design"
    },
    {
        id: 6,
        title: "Data Science Intern",
        company: "AI Labs",
        location: "Chandigarh",
        type: "Internship",
        salary: "₹20,000 / month",
        skills: "Python, Machine Learning"
    }
];


/* =========================
   NAVBAR COMPONENT
========================= */

function Navbar({ user, page, setPage, logout }) {

    return (
        <nav className="navbar navbar-expand-lg navbar-dark bg-dark">
            <div className="container">

                <a className="navbar-brand" href="#"
                   onClick={() => setPage("home")}>
                    <i className="bi bi-briefcase-fill"></i>
                    JobPortal
                </a>

                <button
                    className="navbar-toggler"
                    data-bs-toggle="collapse"
                    data-bs-target="#navMenu">
                    <span className="navbar-toggler-icon"></span>
                </button>

                <div className="collapse navbar-collapse" id="navMenu">

                    <ul className="navbar-nav ms-auto">

                        {user && (
                            <>
                                <li className="nav-item">
                                    <button
                                        className="btn btn-link nav-link"
                                        onClick={() => setPage("dashboard")}>
                                        Dashboard
                                    </button>
                                </li>

                                <li className="nav-item">
                                    <button
                                        className="btn btn-link nav-link"
                                        onClick={() => setPage("jobs")}>
                                        Jobs
                                    </button>
                                </li>

                                <li className="nav-item">
                                    <button
                                        className="btn btn-link nav-link"
                                        onClick={() => setPage("applications")}>
                                        Applications
                                    </button>
                                </li>

                                <li className="nav-item">
                                    <button
                                        className="btn btn-outline-light ms-lg-2"
                                        onClick={logout}>
                                        Logout
                                    </button>
                                </li>
                            </>
                        )}

                        {!user && (
                            <>
                                <li className="nav-item">
                                    <button
                                        className="btn btn-link nav-link"
                                        onClick={() => setPage("login")}>
                                        Login
                                    </button>
                                </li>

                                <li className="nav-item">
                                    <button
                                        className="btn btn-primary ms-lg-2"
                                        onClick={() => setPage("register")}>
                                        Register
                                    </button>
                                </li>
                            </>
                        )}

                    </ul>
                </div>
            </div>
        </nav>
    );
}


/* =========================
   ALERT COMPONENT
========================= */

function AlertMessage({ message }) {

    if (!message.text) return null;

    return (
        <div className={`alert alert-${message.type} alert-dismissible`}>
            {message.text}
        </div>
    );
}


/* =========================
   HOME PAGE
========================= */

function Home({ setPage }) {

    return (
        <>
            <section className="hero text-center">

                <div className="container">

                    <h1 className="display-4 fw-bold">
                        Find Your Dream Job
                    </h1>

                    <p className="lead">
                        Search jobs, build your profile and apply easily.
                    </p>

                    <button
                        className="btn btn-light btn-lg me-2"
                        onClick={() => setPage("jobs")}>
                        Browse Jobs
                    </button>

                    <button
                        className="btn btn-outline-light btn-lg"
                        onClick={() => setPage("register")}>
                        Create Account
                    </button>

                </div>

            </section>

            <div className="container py-5">

                <div className="row text-center">

                    <div className="col-md-4 mb-3">
                        <div className="card dashboard-card p-4">
                            <i className="bi bi-search fs-1 text-primary"></i>
                            <h4>Search Jobs</h4>
                            <p>Find jobs according to your skills.</p>
                        </div>
                    </div>

                    <div className="col-md-4 mb-3">
                        <div className="card dashboard-card p-4">
                            <i className="bi bi-person-circle fs-1 text-success"></i>
                            <h4>Create Profile</h4>
                            <p>Build your professional profile.</p>
                        </div>
                    </div>

                    <div className="col-md-4 mb-3">
                        <div className="card dashboard-card p-4">
                            <i className="bi bi-send fs-1 text-danger"></i>
                            <h4>Apply Online</h4>
                            <p>Apply to jobs with one click.</p>
                        </div>
                    </div>

                </div>

            </div>
        </>
    );
}


/* =========================
   REGISTER COMPONENT
========================= */

function Register({ setPage, setUser }) {

    const [form, setForm] = useState({
        name: "",
        email: "",
        password: ""
    });

    const [message, setMessage] = useState({
        type: "",
        text: ""
    });

    const handleChange = (e) => {

        setForm({
            ...form,
            [e.target.name]: e.target.value
        });

    };


    const handleSubmit = (e) => {

        e.preventDefault();

        const formElement = e.target;

        if (!formElement.checkValidity()) {

            e.stopPropagation();
            formElement.classList.add("was-validated");

            return;
        }


        const users =
            JSON.parse(localStorage.getItem("users")) || [];


        const exists =
            users.find(user => user.email === form.email);


        if (exists) {

            setMessage({
                type: "danger",
                text: "Email already registered."
            });

            return;
        }


        users.push(form);

        localStorage.setItem(
            "users",
            JSON.stringify(users)
        );


        setMessage({
            type: "success",
            text: "Registration successful! Redirecting to login..."
        });


        setTimeout(() => {

            setPage("login");

        }, 1200);
    };


    return (
        <div className="container py-5">

            <div className="row justify-content-center">

                <div className="col-md-6 col-lg-5">

                    <div className="card shadow border-0">

                        <div className="card-body p-4">

                            <h3 className="text-center mb-4">
                                Create Account
                            </h3>

                            <AlertMessage message={message}/>

                            <form
                                onSubmit={handleSubmit}
                                noValidate
                            >

                                <div className="mb-3">

                                    <label className="form-label">
                                        Full Name
                                    </label>

                                    <input
                                        type="text"
                                        name="name"
                                        className="form-control"
                                        value={form.name}
                                        onChange={handleChange}
                                        required
                                        minLength="3"
                                    />

                                    <div className="invalid-feedback">
                                        Please enter your name.
                                    </div>

                                </div>


                                <div className="mb-3">

                                    <label className="form-label">
                                        Email
                                    </label>

                                    <input
                                        type="email"
                                        name="email"
                                        className="form-control"
                                        value={form.email}
                                        onChange={handleChange}
                                        required
                                    />

                                    <div className="invalid-feedback">
                                        Enter a valid email.
                                    </div>

                                </div>


                                <div className="mb-3">

                                    <label className="form-label">
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        name="password"
                                        className="form-control"
                                        value={form.password}
                                        onChange={handleChange}
                                        required
                                        minLength="6"
                                    />

                                    <div className="invalid-feedback">
                                        Password must be at least 6 characters.
                                    </div>

                                </div>


                                <button className="btn btn-primary w-100">
                                    Register
                                </button>

                            </form>


                            <p className="text-center mt-3">

                                Already have an account?

                                <button
                                    className="btn btn-link"
                                    onClick={() => setPage("login")}>
                                    Login
                                </button>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    );
}


/* =========================
   LOGIN COMPONENT
========================= */

function Login({ setPage, setUser }) {

    const [email, setEmail] = useState("");
    const [password, setPassword] = useState("");

    const [message, setMessage] = useState({
        type: "",
        text: ""
    });


    const handleSubmit = (e) => {

        e.preventDefault();

        const form = e.target;

        if (!form.checkValidity()) {

            e.stopPropagation();

            form.classList.add("was-validated");

            return;
        }


        const users =
            JSON.parse(localStorage.getItem("users")) || [];


        const user = users.find(
            u =>
                u.email === email &&
                u.password === password
        );


        if (!user) {

            setMessage({
                type: "danger",
                text: "Invalid email or password."
            });

            return;
        }


        localStorage.setItem(
            "currentUser",
            JSON.stringify(user)
        );


        setUser(user);

        setPage("dashboard");

    };


    return (
        <div className="container py-5">

            <div className="row justify-content-center">

                <div className="col-md-6 col-lg-5">

                    <div className="card shadow border-0">

                        <div className="card-body p-4">

                            <h3 className="text-center mb-4">
                                Login
                            </h3>

                            <AlertMessage message={message}/>

                            <form
                                onSubmit={handleSubmit}
                                noValidate
                            >

                                <div className="mb-3">

                                    <label className="form-label">
                                        Email
                                    </label>

                                    <input
                                        type="email"
                                        className="form-control"
                                        value={email}
                                        onChange={e => setEmail(e.target.value)}
                                        required
                                    />

                                    <div className="invalid-feedback">
                                        Email is required.
                                    </div>

                                </div>


                                <div className="mb-3">

                                    <label className="form-label">
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        className="form-control"
                                        value={password}
                                        onChange={e => setPassword(e.target.value)}
                                        required
                                    />

                                    <div className="invalid-feedback">
                                        Password is required.
                                    </div>

                                </div>


                                <button className="btn btn-primary w-100">
                                    Login
                                </button>

                            </form>


                            <p className="text-center mt-3">

                                Don't have an account?

                                <button
                                    className="btn btn-link"
                                    onClick={() => setPage("register")}>
                                    Register
                                </button>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    );
}


/* =========================
   JOB CARD COMPONENT
========================= */

function JobCard({ job, applyJob }) {

    return (

        <div className="col-md-6 col-lg-4 mb-4">

            <div className="card job-card h-100">

                <div className="card-body">

                    <span className="badge bg-primary mb-2">
                        {job.type}
                    </span>

                    <h5 className="card-title">
                        {job.title}
                    </h5>

                    <h6 className="text-muted">
                        {job.company}
                    </h6>

                    <p className="mb-1">
                        <i className="bi bi-geo-alt"></i>
                        {" "}{job.location}
                    </p>

                    <p className="mb-1">
                        <i className="bi bi-currency-rupee"></i>
                        {" "}{job.salary}
                    </p>

                    <p>
                        <strong>Skills:</strong>
                        {" "}{job.skills}
                    </p>

                    <button
                        className="btn btn-success w-100"
                        onClick={() => applyJob(job)}>
                        Apply Now
                    </button>

                </div>

            </div>

        </div>
    );
}


/* =========================
   JOBS COMPONENT
========================= */

function Jobs({ user }) {

    const [search, setSearch] = useState("");
    const [type, setType] = useState("All");

    const [message, setMessage] = useState({
        type: "",
        text: ""
    });


    const filteredJobs = jobs.filter(job => {

        const text =
            `${job.title} ${job.company} ${job.location} ${job.skills}`
            .toLowerCase();

        const matchesSearch =
            text.includes(search.toLowerCase());

        const matchesType =
            type === "All" || job.type === type;

        return matchesSearch && matchesType;
    });


    const applyJob = (job) => {

        const applications =
            JSON.parse(localStorage.getItem("applications")) || [];


        const alreadyApplied =
            applications.some(
                app =>
                    app.email === user.email &&
                    app.jobId === job.id
            );


        if (alreadyApplied) {

            setMessage({
                type: "warning",
                text: "You have already applied for this job."
            });

            return;
        }


        applications.push({
            jobId: job.id,
            title: job.title,
            company: job.company,
            email: user.email,
            date: new Date().toLocaleDateString(),
            status: "Applied"
        });


        localStorage.setItem(
            "applications",
            JSON.stringify(applications)
        );


        setMessage({
            type: "success",
            text: `Application submitted for ${job.title}!`
        });

    };


    return (

        <div className="container py-5">

            <h2 className="mb-4">
                Find Jobs
            </h2>


            <AlertMessage message={message}/>


            <div className="row mb-4">

                <div className="col-md-8 mb-2">

                    <input
                        type="text"
                        className="form-control"
                        placeholder="Search by job, company, skill or location..."
                        value={search}
                        onChange={e => setSearch(e.target.value)}
                    />

                </div>


                <div className="col-md-4">

                    <select
                        className="form-select"
                        value={type}
                        onChange={e => setType(e.target.value)}
                    >

                        <option>All</option>
                        <option>Full Time</option>
                        <option>Part Time</option>
                        <option>Internship</option>

                    </select>

                </div>

            </div>


            <div className="row">

                {filteredJobs.length > 0 ? (

                    filteredJobs.map(job => (

                        <JobCard
                            key={job.id}
                            job={job}
                            applyJob={applyJob}
                        />

                    ))

                ) : (

                    <div className="text-center py-5">

                        <i className="bi bi-search fs-1"></i>

                        <h4>No jobs found</h4>

                        <p>
                            Try another search or filter.
                        </p>

                    </div>

                )}

            </div>

        </div>
    );
}


/* =========================
   DASHBOARD
========================= */

function Dashboard({ user, setPage }) {

    const applications =
        JSON.parse(localStorage.getItem("applications")) || [];

    const userApplications =
        applications.filter(
            app => app.email === user.email
        );


    return (

        <div className="container py-5">

            <div className="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h2>Welcome, {user.name} 👋</h2>
                    <p className="text-muted">
                        Manage your job search from your dashboard.
                    </p>
                </div>

                <button
                    className="btn btn-primary"
                    onClick={() => setPage("jobs")}>
                    Find Jobs
                </button>

            </div>


            <div className="row mb-4">

                <div className="col-md-4 mb-3">

                    <div className="card dashboard-card shadow-sm p-4">

                        <div className="text-muted">
                            Profile
                        </div>

                        <div className="stat-number">
                            <i className="bi bi-person"></i>
                        </div>

                        <p className="mb-0">
                            {user.email}
                        </p>

                    </div>

                </div>


                <div className="col-md-4 mb-3">

                    <div className="card dashboard-card shadow-sm p-4">

                        <div className="text-muted">
                            Available Jobs
                        </div>

                        <div className="stat-number">
                            {jobs.length}
                        </div>

                    </div>

                </div>


                <div className="col-md-4 mb-3">

                    <div className="card dashboard-card shadow-sm p-4">

                        <div className="text-muted">
                            Applications
                        </div>

                        <div className="stat-number">
                            {userApplications.length}
                        </div>

                    </div>

                </div>

            </div>


            <div className="card shadow-sm border-0">

                <div className="card-body">

                    <h4>Profile Information</h4>

                    <hr/>

                    <p>
                        <strong>Name:</strong> {user.name}
                    </p>

                    <p>
                        <strong>Email:</strong> {user.email}
                    </p>

                    <button
                        className="btn btn-outline-primary"
                        onClick={() => setPage("applications")}>
                        View Applications
                    </button>

                </div>

            </div>

        </div>
    );
}


/* =========================
   APPLICATIONS
========================= */

function Applications({ user }) {

    const applications =
        JSON.parse(localStorage.getItem("applications")) || [];


    const userApplications =
        applications.filter(
            app => app.email === user.email
        );


    return (

        <div className="container py-5">

            <h2 className="mb-4">
                My Applications
            </h2>


            {userApplications.length === 0 ? (

                <div className="alert alert-info">
                    You haven't applied for any jobs yet.
                </div>

            ) : (

                <div className="table-responsive">

                    <table className="table table-bordered table-hover bg-white">

                        <thead className="table-dark">

                            <tr>
                                <th>Job</th>
                                <th>Company</th>
                                <th>Date</th>
                                <th>Status</th>
                            </tr>

                        </thead>

                        <tbody>

                            {userApplications.map((app, index) => (

                                <tr key={index}>

                                    <td>{app.title}</td>

                                    <td>{app.company}</td>

                                    <td>{app.date}</td>

                                    <td>
                                        <span className="badge bg-success">
                                            {app.status}
                                        </span>
                                    </td>

                                </tr>

                            ))}

                        </tbody>

                    </table>

                </div>

            )}

        </div>
    );
}


/* =========================
   FOOTER
========================= */

function Footer() {

    return (

        <footer className="bg-dark text-white text-center p-4">

            <p className="mb-0">
                © 2026 JobPortal | React + Bootstrap
            </p>

        </footer>
    );
}


/* =========================
   MAIN APP
========================= */

function App() {

    const [page, setPage] = useState("home");

    const [user, setUser] = useState(
        JSON.parse(localStorage.getItem("currentUser")) || null
    );


    const logout = () => {

        localStorage.removeItem("currentUser");

        setUser(null);

        setPage("home");
    };


    const renderPage = () => {

        if (page === "home") {

            return <Home setPage={setPage}/>;

        }

        if (page === "register") {

            return (
                <Register
                    setPage={setPage}
                    setUser={setUser}
                />
            );

        }

        if (page === "login") {

            return (
                <Login
                    setPage={setPage}
                    setUser={setUser}
                />
            );

        }


        if (!user) {

            return <Login
                setPage={setPage}
                setUser={setUser}
            />;

        }


        if (page === "dashboard") {

            return (
                <Dashboard
                    user={user}
                    setPage={setPage}
                />
            );

        }

        if (page === "jobs") {

            return <Jobs user={user}/>;

        }

        if (page === "applications") {

            return <Applications user={user}/>;

        }


        return <Dashboard
            user={user}
            setPage={setPage}
        />;
    };


    return (

        <>
            <Navbar
                user={user}
                page={page}
                setPage={setPage}
                logout={logout}
            />

            {renderPage()}

            <Footer/>
        </>

    );
}


/* =========================
   START REACT APPLICATION
========================= */

ReactDOM.createRoot(
    document.getElementById("root")
).render(
    <App/>
);

</script>

</body>
</html>
```
